<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASU1 Trainers</title>
<style>
  /* Same grey world as the operator console (ISA-101): the live console sits on the left, unchanged.
     Teal is the training colour only: lesson UI and highlights, never an alarm or a process state.
     Charts use the console's process media colours (O2 blue, N2 green) for identification only. */
  :root {
    --bg: #c9cbcd; --panel: #dcdedf; --panel-2: #e6e7e8; --line: #9ea2a6; --equip: #4b5054;
    --text: #1f2326; --muted: #5d6368; --value: #0d0f11; --p1: #d7261e; --p2: #f39c12; --bad: #c026d3;
    --o2: #2f6596; --n2: #3f7a5c; --air: #6f7478; --rich: #627a96;
    --train: #0e7490; --train-2: #e6f4f7;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
  button { font: inherit; cursor: pointer; }
  a { color: var(--train); }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 16px; background: #2a2e32; color: #e8eaec; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; flex: none; }
  .brand b { display: block; font-size: 16px; }
  .brand small { display: block; color: #a9afb5; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .home { font: 600 11px var(--mono); color: #cfd4d8; text-decoration: none; border: 1px solid #586068; padding: 3px 8px; }
  .home:hover { color: #fff; border-color: #9aa3ab; }
  /* the trainer switch: one trainer per audience, the topic is kept when switching */
  .switch { display: flex; border: 1px solid #586068; }
  .switch a { padding: 5px 12px; color: #cfd4d8; text-decoration: none; font-weight: 600; font-size: 12.5px; border-left: 1px solid #586068; }
  .switch a:first-child { border-left: none; }
  .switch a:hover { color: #fff; background: #3a3f44; }
  .switch a.on { background: var(--train); color: #fff; }
  .switch small { display: block; font-weight: 400; font-size: 10px; opacity: .8; }

  .stage { display: flex; height: calc(100vh - 52px); }
  #left { flex: 1; min-width: 0; position: relative; background: var(--bg); }
  #console { width: 100%; height: 100%; border: 0; display: block; }
  #figure { position: absolute; inset: 0; overflow: auto; background: var(--panel); display: none; }
  body.fig #figure { display: block; }
  .fig-h { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--train); color: #fff; position: sticky; top: 0; z-index: 2; }
  .fig-h b { font-size: 14px; flex: 1; }
  .fig-h small { font: 600 10.5px var(--mono); letter-spacing: .08em; opacity: .85; }
  .fig-h button { background: none; border: 1px solid #ffffff90; color: #fff; padding: 2px 10px; font-weight: 600; }
  .fig-b { padding: 14px 18px 24px; }
  .fig-b svg { width: 100%; height: auto; display: block; background: #f2f3f3; border: 1px solid #b4b8bc; }
  .fig-b h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .fig-b p { max-width: 900px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin: 10px 0; font-size: 12.5px; }
  .ctl label { display: flex; gap: 8px; align-items: center; }
  .ctl input[type=range] { width: 220px; accent-color: var(--train); }
  .ctl output { font: 700 12.5px var(--mono); min-width: 70px; }
  .verdict { padding: 7px 10px; background: #fff; border-left: 4px solid var(--train); margin: 8px 0; max-width: 900px; }
  .verdict.no { border-left-color: var(--muted); background: #eceded; }
  table.t { border-collapse: collapse; background: #fff; max-width: 900px; width: 100%; }
  table.t th, table.t td { text-align: left; padding: 5px 9px; border-bottom: 1px solid #d0d3d6; }
  table.t th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--panel-2); }
  table.t td.n { font: 700 12.5px var(--mono); text-align: right; white-space: nowrap; }
  table.t td.m { font: 11.5px var(--mono); color: var(--muted); }
  .ax, .grid, .brk { fill: none; }
  .ax { stroke: #8d9297; stroke-width: 1; }
  .grid { stroke: #dde0e2; stroke-width: 1; }
  .axl { font: 10.5px var(--mono); fill: var(--muted); }
  .axt { font: 600 11px var(--sans); fill: var(--muted); }
  .cv { fill: none; stroke-width: 2.4; }
  .cv.o2 { stroke: var(--o2); } .cv.n2 { stroke: var(--n2); } .cv.air { stroke: var(--air); } .cv.rich { stroke: var(--rich); }
  .cv.dash { stroke-dasharray: 6 4; }
  .pt { stroke: #fff; stroke-width: 1.5; }
  .pt.o2 { fill: var(--o2); } .pt.n2 { fill: var(--n2); } .pt.air { fill: var(--air); }
  .ptl { font: 600 11px var(--sans); fill: var(--text); }
  .ptv { font: 700 11px var(--mono); fill: var(--value); }
  .ghost { fill: none; stroke: var(--train); stroke-width: 2.5; }
  .ghostl { font: 700 11px var(--mono); fill: var(--train); }
  .brk { stroke: var(--text); stroke-width: 1.2; fill: none; }
  .raw { fill: none; stroke: #a3a8ac; stroke-width: 1; }
  .held { fill: none; stroke: var(--text); stroke-width: 1.6; }
  .dot { fill: var(--text); }
  .step-in { fill: none; stroke: var(--air); stroke-width: 2.2; }
  .step-out { fill: none; stroke: var(--o2); stroke-width: 2.4; }
  .note-t { font: 11px var(--sans); fill: var(--muted); }

  /* lesson panel */
  #lesson { width: 470px; flex: none; min-width: 0; background: #fff; border-left: 2px solid var(--train); display: flex; flex-direction: column; min-height: 0; }
  .topics { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; background: var(--train-2); border-bottom: 1px solid #cfe3e8; }
  .topics a { font: 600 11.5px var(--sans); padding: 3px 9px; border: 1px solid var(--train); color: var(--train); text-decoration: none; background: #fff; }
  .topics a.on { background: var(--train); color: #fff; }
  .topics span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; align-self: center; margin-right: 4px; }
  .sh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--train); color: #fff; }
  .sh b { font-size: 14.5px; flex: 1; }
  .sh small { font: 600 10.5px var(--mono); opacity: .85; letter-spacing: .06em; }
  .sh button { background: none; border: 1px solid #ffffff80; color: #fff; padding: 1px 9px; font-weight: 700; }
  .sh button:disabled { opacity: .35; cursor: default; }
  .lb { padding: 10px 14px 18px; overflow: auto; flex: 1; }
  .lb p { margin: 0 0 8px; }
  .lb h4 { margin: 10px 0 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--train); }
  .live { background: var(--train-2); border-left: 3px solid var(--train); padding: 6px 9px; margin: 10px 0; }
  .live h4 { margin-top: 0; }
  .live ul { margin: 0; padding-left: 16px; } .live li { margin: 2px 0; }
  .watch { display: flex; flex-wrap: wrap; gap: 4px; }
  .watch button, .tagbtn { font: 700 10.5px var(--mono); padding: 2px 7px; border: 1px solid var(--train); background: #fff; color: var(--train); }
  .watch button:hover, .tagbtn:hover { background: var(--train-2); }
  .think { color: var(--muted); font-style: italic; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .act { padding: 5px 11px; border: 1px solid var(--train); background: var(--train); color: #fff; font-weight: 600; }
  .act.sec { background: #fff; color: var(--train); }
  .cards { display: grid; gap: 8px; }
  .card { display: block; border: 1px solid #c9d7dc; padding: 9px 11px; text-decoration: none; color: var(--text); }
  .card:hover { border-color: var(--train); background: var(--train-2); }
  .card b { color: var(--train); display: block; font-size: 13.5px; }
  .card small { color: var(--muted); }
  .later { color: var(--muted); font-size: 12px; margin-top: 12px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  pre { background: #1f2326; color: #e8eaec; padding: 8px 10px; font: 11.5px/1.5 var(--mono); overflow: auto; }

  /* IT/OT data path: the same value at every layer, from the field (bottom of the stack) up to IT */
  .dp { display: flex; flex-direction: column-reverse; gap: 0; margin: 8px 0; }
  .dpl { border: 1px solid #c3c8cc; background: #f7f8f8; padding: 7px 10px; position: relative; opacity: .55; }
  .dpl.on { opacity: 1; border: 2px solid var(--train); background: #fff; }
  .dp.all .dpl { opacity: 1; }
  .dpl + .dpl { margin-bottom: 14px; }
  .dpl + .dpl::after { content: "▲"; position: absolute; bottom: -15px; left: 22px; color: var(--muted); font-size: 11px; }
  .dpl h5 { margin: 0 0 3px; display: flex; gap: 8px; align-items: baseline; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .dpl h5 .lv { font: 700 10px var(--mono); padding: 0 5px; border: 1px solid #b4b8bc; color: var(--muted); }
  .dpl .big { font: 700 15px var(--mono); color: var(--value); }
  .dpl { cursor: pointer; }
  .dpl .sum { font: 12px var(--mono); color: var(--text); word-break: break-all; }
  .dpl .body { display: none; margin-top: 4px; cursor: auto; }
  .dpl.open .body { display: block; }
  .dpl.open .sum { display: none; }
  .dpl .kv { display: grid; grid-template-columns: 112px 1fr; gap: 1px 8px; font-size: 12px; }
  .dpl .kv span:nth-child(odd) { color: var(--muted); }
  .dpl .kv span:nth-child(even) { font-family: var(--mono); word-break: break-all; }
  .words { display: inline-flex; gap: 4px; }
  .words i { font-style: normal; padding: 0 5px; border: 1px solid #8d9297; background: #fff; }
  .q-GOOD { color: var(--text); } .q-BAD, .q-NOT_APPLICABLE { color: var(--bad); font-weight: 700; }
  .dpl canvas { width: 100%; height: 54px; display: block; background: #f2f3f3; border: 1px solid #d0d3d6; margin-top: 4px; }
  .tagpick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tagpick { margin-bottom: 8px; }
  .tagpick select { font: 12px var(--mono); padding: 2px 4px; flex: 1; min-width: 0; max-width: 100%; }

  @media (max-width: 1000px) {
    .stage { flex-direction: column; height: auto; }
    #lesson { width: 100%; min-width: 0; border-left: none; border-bottom: 2px solid var(--train); order: -1; }
    .tagpick select { width: 100%; }
    #left { height: 78vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="5" fill="#1d4f91"/>
      <path d="M9 30V10M9 20h10M19 30V10M24 30l4-20 4 20" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round"/>
    </svg>
    <div><b>Haltenberg Chemische Werke</b><small>ASU1 · Trainers</small></div>
  </div>
  <nav class="switch" id="switch" aria-label="Choose a trainer"></nav>
  <div class="spacer"></div>
  <a class="home" href="/operator">Operator console</a>
  <a class="home" href="/">⌂ All systems</a>
</header>
<div class="stage">
  <section id="left">
    <iframe id="console" title="ASU1 operator console (live)"></iframe>
    <div id="figure"><div class="fig-h"><small>DEEP DIVE</small><b id="fig-title"></b><button id="fig-close">◀ Live console</button></div><div class="fig-b" id="fig-body"></div></div>
  </section>
  <aside id="lesson"></aside>
</div>
<script>
/* ---------------------------------------------------------------- the trainers
   Three trainers, one per audience, over the same plant:
     🎓 Process      plain language, on the operator console's overview (operator.html, 🎓 Training)
     ⚙️ Engineering  how each unit works: guided detail displays and deep-dive figures
     🔌 IT/OT        how one value travels from the sensor to OPC UA, and what that means for data
   This page shows the LIVE operator console (operator.html?embed=1) on the left and the lesson on the
   right. A step either steers the console (go to a display, highlight regions in its viewBox, open a
   faceplate) or replaces it with a deep-dive figure. Like the console, everything here is built from
   DCS data only (/api/state, /api/config, /api/history, /api/datapath): never from instructor
   scenarios or the plant's ground truth. Routes: #<trainer>/<topic>/<step>, ?tag= for the IT/OT tag. */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let DP_OPEN = new Set();
let CFG = null, TAG = {}, ST = null, DP = null, DP_DOTS = null, HIST = { deadband_pct: 0.25, max_interval_s: 60 };

function fmt(tag, v, extra = 0) {
  if (v === null || v === undefined || Number.isNaN(v)) return "####";
  return Number(v).toFixed(Math.max(0, (TAG[tag] ? TAG[tag].dec : 2) + extra));
}
function pv(tag) { return ST && ST.tags[tag] ? ST.tags[tag].pv : null; }
function u(tag, extra = 0) { const t = TAG[tag]; return `${fmt(tag, pv(tag), extra)} ${t ? esc(t.unit) : ""}`; }
function running(k) { return ST.equipment[k].state === "RUNNING"; }
const tstr = ts => ts ? new Date(ts * 1000).toLocaleTimeString("en-GB") : "—";
const tagBtn = t => `<button class="tagbtn" data-tag="${t}" title="${esc(TAG[t] ? TAG[t].desc : "")}">${t}</button>`;

// Clausius-Clapeyron, the DCS's own formula and constants (CFG.t_sat), as in the TY-411…413 calculations.
const P_ATM = 1.013;
const tsat = (p, k) => p > 0.05 ? 1 / (1 / k[0] - 8.314 / k[1] * Math.log(p / P_ATM)) - 273.15 : null;
const psat = (tc, k) => P_ATM * Math.exp(k[1] / 8.314 * (1 / k[0] - 1 / (tc + 273.15)));
// Ideal-mixture (Raoult) bubble point of an O2/N2 liquid with O2 fraction x at pressure p: an estimate.
function bubble(p, x) {
  let lo = -215, hi = -110;
  for (let i = 0; i < 50; i++) {
    const m = (lo + hi) / 2, f = x * psat(m, CFG.t_sat.O2) + (1 - x) * psat(m, CFG.t_sat.N2) - p;
    if (f > 0) hi = m; else lo = m;
  }
  return (lo + hi) / 2;
}

/* ---------------------------------------------------------------- chart helper (SVG strings) */
function frame({ w = 900, h = 380, l = 64, r = 24, t = 18, b = 44, x, y, xt, yt, xl, yl, xf = v => v, yf = v => v }) {
  const X = v => l + (v - x[0]) / (x[1] - x[0]) * (w - l - r), Y = v => t + (y[1] - v) / (y[1] - y[0]) * (h - t - b);
  let s = "";
  for (const v of yt) s += `<path class="grid" d="M${l} ${Y(v)}H${w - r}"/><text class="axl" x="${l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${yf(v)}</text>`;
  for (const v of xt) s += `<path class="grid" d="M${X(v)} ${t}V${h - b}"/><text class="axl" x="${X(v)}" y="${h - b + 15}" text-anchor="middle">${xf(v)}</text>`;
  s += `<path class="ax" d="M${l} ${t}V${h - b}H${w - r}"/>`;
  s += `<text class="axt" x="${(l + w - r) / 2}" y="${h - 8}" text-anchor="middle">${xl}</text>`;
  s += `<text class="axt" transform="translate(14,${(t + h - b) / 2}) rotate(-90)" text-anchor="middle">${yl}</text>`;
  return { X, Y, s, w, h, l, r, t, b };
}
const poly = (F, pts) => "M" + pts.map(([a, c]) => `${F.X(a).toFixed(1)} ${F.Y(c).toFixed(1)}`).join("L");
const range = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);

/* ---------------------------------------------------------------- deep-dive figures
   build(el): static markup once per visit; update(el): every poll (live values) and on slider input. */
const FIG = {};

FIG.vp = {
  title: "Boiling point vs pressure · why the double column works",
  build(el) {
    el.innerHTML = `
      <p>Every liquid boils at a higher temperature when the pressure is higher (a pressure cooker uses the same effect).
        The two curves are the boiling points of pure nitrogen and pure oxygen, calculated with the DCS's own formula
        (the one behind TY-411, TY-412 and TY-413). The dots are ASU1, live.</p>
      <svg id="vp-svg" viewBox="0 0 900 400"></svg>
      <div class="ctl"><label>What if the HP column ran at <input type="range" id="vp-p" min="2" max="8" step="0.05"> <output id="vp-pv"></output></label>
        <button class="tagbtn" id="vp-reset">back to live</button></div>
      <div class="verdict" id="vp-verdict"></div>
      <h3>How to read it</h3>
      <p>At atmospheric pressure nitrogen boils at −196 °C and oxygen at −183 °C: nitrogen is the colder one. A condenser
        that uses nitrogen to boil oxygen looks impossible. But the HP column runs at about 5.6 bar(a): there, nitrogen
        condenses at about −177 °C. The LP column runs at about 1.3 bar(a): there, oxygen boils at about −180 °C. The
        nitrogen is now a few kelvin <b>warmer</b> than the oxygen, so heat flows from it to the oxygen in the main
        condenser E-404. The nitrogen condenses (that is the HP column's reflux), the oxygen boils (that is the LP
        column's reboil). The measured version of that gap is TDI-410.</p>`;
    const s = $("#vp-p", el);
    s.addEventListener("input", () => { s.dataset.touched = "1"; this.update(el); });
    $("#vp-reset", el).addEventListener("click", () => { delete s.dataset.touched; this.update(el); });
  },
  update(el) {
    const N2 = CFG.t_sat.N2, O2 = CFG.t_sat.O2, s = $("#vp-p", el);
    const php = pv("PI-401"), plp = pv("PIC-402");
    if (!s.dataset.touched) s.value = php ?? 5.6;
    const pw = +s.value;
    $("#vp-pv", el).textContent = pw.toFixed(2) + " bar(a)";
    const F = frame({ w: 900, h: 400, x: [0, 8], y: [-200, -170], xt: range(0, 8, 8), yt: range(-200, -170, 6), yf: v => v.toFixed(0),
      xl: "pressure, bar(a)", yl: "boiling / condensing temperature, °C" });
    const ps = range(0.3, 8, 120);
    let svg = F.s + `<path class="grid" d="M${F.X(P_ATM)} ${F.t}V${F.h - F.b}" style="stroke:#b4b8bc;stroke-dasharray:3 3"/>
      <text class="note-t" x="${F.X(P_ATM) + 4}" y="${F.t + 12}">1 atm</text>
      <path class="cv o2" d="${poly(F, ps.map(p => [p, tsat(p, O2)]).filter(([, t]) => t <= -170))}"/>
      <path class="cv n2" d="${poly(F, ps.map(p => [p, tsat(p, N2)]).filter(([, t]) => t >= -200 && t <= -170))}"/>
      <text class="ptl" x="${F.X(psat(-172, O2)) - 8}" y="${F.Y(-172)}" text-anchor="end" style="fill:var(--o2)">oxygen</text>
      <text class="ptl" x="${F.X(7.2)}" y="${F.Y(tsat(7.2, N2)) + 18}" style="fill:var(--n2)">nitrogen</text>`;
    const dot = (p, t, cls, lbl, val, dx = 10, dy = -8, anchor = "start") => p == null || t == null ? "" :
      `<circle class="pt ${cls}" cx="${F.X(p)}" cy="${F.Y(t)}" r="6"/>
       <text class="ptl" x="${F.X(p) + dx}" y="${F.Y(t) + dy}" text-anchor="${anchor}">${lbl}</text>
       <text class="ptv" x="${F.X(p) + dx}" y="${F.Y(t) + dy + 13}" text-anchor="${anchor}">${val}</text>`;
    const t411 = pv("TY-411"), t412 = pv("TY-412"), t413 = pv("TY-413");
    svg += dot(php, t411, "n2", "HP top: N₂ condenses", `${fmt("PI-401", php)} bar · ${fmt("TY-411", t411, -1)} °C`, 10, -22);
    svg += dot(plp, t412, "o2", "LP sump: O₂ boils", `${fmt("PIC-402", plp)} bar · ${fmt("TY-412", t412, -1)} °C`, 12, -6);
    svg += dot(plp, t413, "n2", "LIN after its valve", `${fmt("TY-413", t413, -1)} °C`, 12, 4);
    // the condenser gap: N2 condensing at HP vs O2 boiling at LP
    if (t411 != null && t412 != null) {
      const xb = F.X(php) + 150;
      svg += `<path class="brk" d="M${F.X(php)} ${F.Y(t411)}H${xb}M${F.X(plp)} ${F.Y(t412)}H${xb}" style="stroke-dasharray:3 3"/>
        <path class="brk" d="M${xb} ${F.Y(t411)}V${F.Y(t412)}"/>
        <text class="ptv" x="${xb + 6}" y="${(F.Y(t411) + F.Y(t412)) / 2 + 4}">ΔT ${(t411 - t412).toFixed(1)} K</text>`;
    }
    // what-if: N2 condensing at the chosen HP pressure against the live LP sump
    const tw = tsat(pw, N2);
    if (s.dataset.touched) svg += `<circle class="ghost" cx="${F.X(pw)}" cy="${F.Y(tw)}" r="8"/>
      <text class="ghostl" x="${F.X(pw) - 12}" y="${F.Y(tw) - 12}" text-anchor="end">what if: ${tw.toFixed(1)} °C</text>`;
    $("#vp-svg", el).innerHTML = svg;
    const ref = t412 ?? tsat(1.3, O2), dt = tw - ref, pmin = psat(ref, N2);
    const v = $("#vp-verdict", el);
    v.classList.toggle("no", dt <= 0);
    v.innerHTML = dt > 0

// IT/OT: dead time and lag. A synthetic first-order-plus-dead-time step response with the plant's documented
// figures (purity analyser: ~240 s dead time, ~600 s lag), and the live historian for the same pair of tags.
FIG.deadtime = {
  title: "Cause and effect are minutes apart · dead time and lag",
  build(el) {
    el.innerHTML = `
      <p>When the operator changes something, the measurement that shows the result doesn't move at once. First nothing
        happens for a while (<b>dead time</b>: the gas has to travel, the analyser has to take and analyse a sample), then
        it moves gradually (<b>lag</b>: vessels, column trays and pipes fill and empty). On ASU1 the oxygen purity AI-601
        reacts to a change of the oxygen draw only after about 4 minutes, and needs about 10 more to get most of the way.</p>
      <svg id="dt-svg" viewBox="0 0 900 300"></svg>
      <div class="ctl"><label>Dead time <input type="range" id="dt-th" min="0" max="900" step="30" value="240"> <output id="dt-tho"></output></label>
        <label>Lag (time constant) <input type="range" id="dt-tau" min="30" max="1800" step="30" value="600"> <output id="dt-tauo"></output></label></div>
      <div class="verdict" id="dt-v"></div>
      <h3>The same two tags in the historian · last 4 hours, each scaled to its own min–max</h3>
      <svg id="dt-live" viewBox="0 0 900 220"></svg>
      <p>Look for a move in the oxygen send-out (FIC-501) and find its echo in the purity (AI-601) minutes later. In
        steady state both just wander; after a load change or a trip the delay is easy to see.</p>
      <h3>What it means for data work</h3>
      <p>Correlate the two tags at the same timestamp and the relation looks weak or even absent. Shift the effect back by
        the dead time (and allow for the lag) and it appears. For machine learning: build features from the <i>past</i>
        of the cause (lagged values, rolling windows of the right length), and never let a model "explain" a purity value
        with a flow measured at the same second. A soft sensor for purity has to predict minutes ahead.</p>`;
    this.at = 0;
    for (const id of ["dt-th", "dt-tau"]) $("#" + id, el).addEventListener("input", () => this.update(el, true));
  },
  update(el, local) {
    const th = +$("#dt-th", el).value, tau = +$("#dt-tau", el).value;
    $("#dt-tho", el).textContent = `${th} s`; $("#dt-tauo", el).textContent = `${tau} s`;
    const T = 3600, t0 = 300;
    const F = frame({ w: 900, h: 300, x: [0, T], y: [-0.2, 1.15], xt: range(0, T, 6), yt: [0, 0.5, 1],
      xl: "time, min", yl: "fraction of the final change", xf: v => (v / 60).toFixed(0), yf: v => (v * 100).toFixed(0) + " %" });
    const resp = t => t < t0 + th ? 0 : 1 - Math.exp(-(t - t0 - th) / tau);
    const ts = range(0, T, 360);
    let s = F.s + `<path class="step-in" d="${poly(F, [[0, 0], [t0, 0], [t0, 1], [T, 1]])}"/>
      <path class="step-out" d="${poly(F, ts.map(t => [t, resp(t)]))}"/>
      <text class="ptl" x="${F.X(t0) + 6}" y="${F.Y(1) - 6}">cause: the oxygen draw steps up</text>
      <text class="ptl" x="${F.X(T - 120)}" y="${F.Y(resp(T - 120)) + 20}" text-anchor="end" style="fill:var(--o2)">effect: the analyser</text>
      <path class="brk" d="M${F.X(t0)} ${F.Y(-0.1)}H${F.X(t0 + th)}M${F.X(t0)} ${F.Y(-0.13)}V${F.Y(-0.07)}M${F.X(t0 + th)} ${F.Y(-0.13)}V${F.Y(-0.07)}"/>
      <text class="ptv" x="${F.X(t0 + th) + 6}" y="${F.Y(-0.1) + 4}">${th ? "dead time" : ""}</text>
      <path class="grid" d="M${F.X(t0 + th + tau)} ${F.Y(0)}V${F.Y(0.632)}H${F.X(0)}" style="stroke:#8d9297;stroke-dasharray:3 3"/>
      <text class="axl" x="${F.X(t0 + th + tau) + 6}" y="${F.Y(0.632) + 14}">63 % after dead time + one time constant</text>`;
    $("#dt-svg", el).innerHTML = s;
    const t95 = th + 3 * tau;
    $("#dt-v", el).innerHTML = `With these values the effect starts <b>${(th / 60).toFixed(1)} min</b> after the cause and is 95 % complete after <b>${(t95 / 60).toFixed(0)} min</b>. A dashboard that compares both at the same moment sees the cause long before the effect.`;
    if (!local) this.live(el);
  },
  async live(el) {
    if (this.busy || (this.at && Date.now() - this.at < 30000)) return;
    this.busy = true;
    try {
      const h = await (await fetch("/api/history?tags=FIC-501.PV,AI-601.PV&minutes=240&points=240")).json();
      this.at = Date.now();
      const F = frame({ w: 900, h: 220, b: 34, x: [h.start, h.end], y: [0, 1], xt: range(h.start, h.end, 4), yt: [0, 1],
        xl: "", yl: "", xf: v => new Date(v * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }), yf: v => v ? "max" : "min" });
      let s = F.s;
      for (const [name, cls] of [["FIC-501.PV", "air"], ["AI-601.PV", "o2"]]) {
        const pts = (h.series[name] || []).filter(p => p[1] != null).map(p => [p[0], (p[1] + p[2]) / 2]);
        if (pts.length < 2) continue;
        const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), sp = (hi - lo) || 1;
        s += `<path class="cv ${cls}" d="${poly(F, pts.map(([t, v]) => [t, (v - lo) / sp]))}" style="stroke-width:1.6"/>`;
      }
      s += `<text class="ptl" x="${F.l + 8}" y="${F.t + 12}" style="fill:var(--air)">FIC-501 oxygen send-out</text>
            <text class="ptl" x="${F.l + 200}" y="${F.t + 12}" style="fill:var(--o2)">AI-601 oxygen purity</text>`;
      $("#dt-live", el).innerHTML = s;
    } catch {} finally { this.busy = false; }
  },
};

// IT/OT: exception reporting, the same algorithm as dcs/historian.py, on a synthetic 10-minute signal.
FIG.deadband = {
  title: "Not every scan is stored · exception reporting",
  build(el) {
    el.innerHTML = `
      <p>The DCS scans every tag every second, but its historian does not store every scan. It stores a new value only when
        it differs from the last <i>stored</i> value by more than a <b>deadband</b> (ASU1: ${HIST.deadband_pct} % of the tag's span),
        or when the <b>heartbeat</b> time has passed (ASU1: ${HIST.max_interval_s} s) so a flat line still proves the point is alive. Real
        historians (PI, IP.21, PHD, …) work the same way, often with an extra compression step on top.</p>
      <svg id="db-svg" viewBox="0 0 900 320"></svg>
      <div class="ctl"><label>Deadband <input type="range" id="db-pct" min="0" max="3" step="0.05" value="${HIST.deadband_pct}"> <output id="db-o"></output></label>
        <label><input type="checkbox" id="db-raw" checked> show every scan</label></div>
      <div class="verdict" id="db-v"></div>
      <h3>What it means for data work</h3>
      <p><b>Timestamps are irregular.</b> A quiet tag has a sample a minute, a busy one a sample a second. Resample before
        you join tags. <b>Between two samples the value is the last stored one</b> (sample-and-hold, the black line), not a
        straight line between them. <b>Averages must be time-weighted</b>: a plain mean of the stored samples
        over-weights the busy periods. The Node-RED flow on this system computes a 15-minute time-weighted average for
        exactly that reason.</p>`;
    $("#db-pct", el).addEventListener("input", () => this.update(el));
    $("#db-raw", el).addEventListener("change", () => this.update(el));
  },
  signal() {   // seeded, so the picture is the same for everyone
    if (this.sig) return this.sig;
    let seed = 7, v = 50, out = [];
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let t = 0; t < 600; t++) {
      v += (rnd() - 0.5) * 0.25 + (t > 240 && t < 300 ? 0.35 : 0);   // a slow wander, plus a ramp at minute 4
      out.push([t, v + (rnd() - 0.5) * 0.3]);
    }
    return this.sig = out;
  },
  update(el) {
    const pct = +$("#db-pct", el).value, span = 100, db = span * pct / 100, hb = HIST.max_interval_s, sig = this.signal();
    $("#db-o", el).textContent = pct.toFixed(2) + " %";
    const stored = [];
    for (const [t, v] of sig) {
      const last = stored[stored.length - 1];
      if (!last || t - last[0] >= hb || Math.abs(v - last[1]) > db) stored.push([t, v]);
    }
    let err = 0, k = 0;
    for (const [t, v] of sig) { while (k + 1 < stored.length && stored[k + 1][0] <= t) k++; err = Math.max(err, Math.abs(v - stored[k][1])); }
    const lo = Math.min(...sig.map(p => p[1])) - 1, hi = Math.max(...sig.map(p => p[1])) + 1;
    const F = frame({ w: 900, h: 320, x: [0, 600], y: [lo, hi], xt: range(0, 600, 10), yt: range(Math.ceil(lo), Math.floor(hi), 4),
      xl: "time, min", yl: "value, % of span", xf: v => (v / 60).toFixed(0), yf: v => v.toFixed(1) });
    const held = [];
    stored.forEach(([t, v], i) => { held.push([t, v]); held.push([i + 1 < stored.length ? stored[i + 1][0] : 600, v]); });
    let s = F.s + ($("#db-raw", el).checked ? `<path class="raw" d="${poly(F, sig)}"/>` : "");
    s += `<path class="held" d="${poly(F, held)}"/>` + stored.map(([t, v]) => `<circle class="dot" cx="${F.X(t)}" cy="${F.Y(v)}" r="3"/>`).join("");
    $("#db-svg", el).innerHTML = s;
    $("#db-v", el).innerHTML = `<b>${sig.length}</b> scans → <b>${stored.length}</b> stored samples (${(stored.length / sig.length * 100).toFixed(1)} %).
      The largest difference between a scan and what the historian gives back is <b>${err.toFixed(2)}</b> % of span. Wider deadband: less storage, less detail.`;
  },
};

/* ---------------------------------------------------------------- routing and state */
let R = { trainer: "eng", topic: null, step: 0 }, curTag = "FIC-101", consoleReady = false, consoleRoute = null, figBuilt = null;

function parseHash() {
  const [tr, topic, step] = location.hash.slice(1).split("/");
  const T = TRAINERS[tr] && tr !== "process" ? tr : "eng";
  const tp = TRAINERS[T].topics.find(t => t.id === topic) ? topic : null;
  R = { trainer: T, topic: tp, step: tp ? Math.max(0, Math.min(TRAINERS[T].topics.find(t => t.id === tp).steps.length - 1, +step || 0)) : 0 };
}
function hashOf(r) { return `#${r.trainer}${r.topic ? "/" + r.topic + "/" + r.step : ""}`; }
function nav(r) {
  const h = hashOf(r);
  if (location.hash !== h) history.pushState(null, "", h + "");
  route();
}
const topic = () => R.topic && TRAINERS[R.trainer].topics.find(t => t.id === R.topic);
const step = () => topic() ? topic().steps[R.step] : null;

function route() {
  parseHash();
  store.set("hcw.trainer", hashOf(R));
  renderSwitch(); buildLesson(); applyStep();
}

function renderSwitch() {
  const tp = topic();
  const procStep = tp ? tp.process : 0;
  $("#switch").innerHTML = Object.entries(TRAINERS).map(([k, t]) => {
    // switching keeps the topic where the other trainer has one: same unit, another depth
    let href;
    if (k === "process") href = `/operator?training=1&step=${procStep}#overview`;
    else {
      const same = tp && TRAINERS[k].topics.find(x => x.id === tp.id);
      href = `#${k}${same ? "/" + same.id + "/0" : ""}`;
    }
    return `<a href="${href}" class="${k === R.trainer ? "on" : ""}" title="${esc(t.sub)}">${t.icon} ${t.label}<small>${esc(t.sub)}</small></a>`;
  }).join("");
}

/* ---------------------------------------------------------------- the lesson panel */
function buildLesson() {
  const T = TRAINERS[R.trainer], tp = topic(), st = step(), L = $("#lesson");
  const chips = `<div class="topics"><span>${T.icon} ${T.label}</span><a href="#${R.trainer}" class="${tp ? "" : "on"}">Topics</a>
    ${T.topics.map(t => `<a href="#${R.trainer}/${t.id}/0" class="${tp && tp.id === t.id ? "on" : ""}">${esc(t.title)}</a>`).join("")}</div>`;
  if (!tp) {
    L.innerHTML = chips + `<div class="sh"><b>${T.icon} ${T.label} trainer</b></div><div class="lb">${T.intro}
      <div class="cards">${T.topics.map(t => `<a class="card" href="#${R.trainer}/${t.id}/0"><b>${esc(t.title)}</b><small>${esc(t.sub)} · ${t.steps.length} steps</small></a>`).join("")}</div>
      <p class="later">${esc(T.later)}</p>
      <p class="later">Prefer it simpler? <a href="/operator?training=1">🎓 The Process trainer</a> walks through the whole plant in plain language.</p></div>`;
    return;
  }
  const n = tp.steps.length;
  L.innerHTML = chips + `
    <div class="sh"><small>STEP ${R.step + 1} / ${n}</small><b>${esc(st.title)}</b>
      <button data-st="-1" ${R.step === 0 ? "disabled" : ""} aria-label="Previous step">◀</button>
      <button data-st="1" ${R.step === n - 1 ? "disabled" : ""} aria-label="Next step">▶</button></div>
    <div class="lb">
      ${tp.dp ? dpPickerHtml() : ""}
      ${st.text}
      ${tp.dp ? `<div class="dp ${st.layer === "all" ? "all" : ""}" id="dp"></div>` : ""}
      ${st.snippet ? `<h4>Read this node from Python</h4><pre id="snippet"></pre>` : ""}
      <div class="actions">
        ${st.deep ? `<button class="act" data-fig="${st.deep}">🔎 Deep dive: ${esc(FIG[st.deep].title.split(" · ")[0])}</button>` : ""}
        ${st.fig ? `<button class="act sec" data-showconsole="1">Live console</button>` : ""}
        ${!st.fig && st.go ? `<button class="act sec" data-reapply="1" id="reapply" style="display:none">↺ Back to this step's display</button>` : ""}
      </div>
      ${st.live ? `<div class="live"><h4>Right now in ASU1</h4><ul data-live></ul></div>` : ""}
      ${st.watch ? `<h4>Watch these tags</h4><div class="watch">${st.watch.filter(t => TAG[t]).map(tagBtn).join("")}</div>` : ""}
      ${st.think ? `<p class="think" style="margin-top:10px">${esc(st.think)}</p>` : ""}
    </div>`;
  $$("[data-st]", L).forEach(b => b.addEventListener("click", () => nav({ ...R, step: R.step + +b.dataset.st })));
  $$("[data-fig]", L).forEach(b => b.addEventListener("click", () => showFigure(b.dataset.fig)));
  $$("[data-showconsole]", L).forEach(b => b.addEventListener("click", () => showConsole()));
  $$("[data-reapply]", L).forEach(b => b.addEventListener("click", () => applyStep()));
  if (tp.dp) {
    $("#dp-tag", L).addEventListener("change", e => setTag(e.target.value));
    DP = null; DP_DOTS = null; refreshDatapath(true);
  }
  renderLive();
}

function renderLive() {
  const st = step(), ul = $("#lesson [data-live]");
  if (!st || !ul || !ST || !st.live) return;
  try { ul.innerHTML = st.live().map(l => `<li>${l}</li>`).join(""); } catch { ul.innerHTML = ""; }
}

/* ---------------------------------------------------------------- console and figure pane */
function toConsole(msg) { if (consoleReady) $("#console").contentWindow.postMessage({ type: "hcw-train", ...msg }, location.origin); }

function applyStep() {
  const st = step();
  if (st && st.fig) { showFigure(st.fig); return; }
  showConsole();
  if (!st) {   // a trainer's topic list: the overview, with the units that have a topic outlined
    toConsole({ go: "#overview", highlight: null });
    return;
  }
  toConsole({ go: st.go, highlight: st.hl ? { on: st.go, regions: st.hl } : null, select: st.sel || (topic().dp ? curTag : undefined) });
  const b = $("#reapply"); if (b) b.style.display = "none";
}

function showFigure(id) {
  document.body.classList.add("fig");
  $("#fig-title").textContent = FIG[id].title;
  if (figBuilt !== id) { FIG[id].build($("#fig-body")); figBuilt = id; }
  if (CFG && ST) FIG[id].update($("#fig-body"));
}
function showConsole() { document.body.classList.remove("fig"); }
$("#fig-close").addEventListener("click", showConsole);

window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "hcw-console") return;
  const m = e.data;
  if (m.ready) { consoleReady = true; applyStep(); }
  if (m.route) {
    consoleRoute = m.route;
    const st = step(), b = $("#reapply");
    if (b && st && st.go) b.style.display = m.route === st.go ? "none" : "";
  }
  if (m.select && topic() && topic().dp && TAG[m.select] && m.select !== curTag) setTag(m.select, true);
});

// a tag button in the lesson opens its faceplate on the console (and, in the IT/OT trainer, follows it)
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tag]");
  if (!b || !TAG[b.dataset.tag]) return;
  if (topic() && topic().dp) setTag(b.dataset.tag);
  else { showConsole(); toConsole({ select: b.dataset.tag }); }
});

/* ---------------------------------------------------------------- IT/OT data path */
function dpPickerHtml() {
  const blocks = CFG.blocks.map(b => `<optgroup label="${esc(b.label)}">${CFG.tags.filter(t => t.block === b.id)
    .map(t => `<option value="${t.tag}" ${t.tag === curTag ? "selected" : ""}>${t.tag} · ${esc(t.desc)}</option>`).join("")}</optgroup>`).join("");
  return `<div class="tagpick"><b>Following</b> <select id="dp-tag">${blocks}</select></div>`;
}
function setTag(tag, fromConsole) {
  if (!TAG[tag]) return;
  curTag = tag;
  const url = new URL(location.href); url.searchParams.set("tag", tag); history.replaceState(history.state, "", url);
  const sel = $("#dp-tag"); if (sel) sel.value = tag;
  if (!fromConsole) { showConsole(); toConsole({ select: tag }); }
  DP = null; DP_DOTS = null; refreshDatapath(true);
}
async function refreshDatapath(force) {
  if (!topic() || !topic().dp) return;
  const tag = curTag;
  try {
    const d = await (await fetch("/api/datapath?tag=" + encodeURIComponent(tag))).json();
    if (tag !== curTag) return;
    DP = d;
    if (step().layer === "historian" && (force || !DP_DOTS || Date.now() - DP_DOTS.at > 10000)) {
      const h = await (await fetch(`/api/history?tags=${encodeURIComponent(tag)}.PV&minutes=15&points=900`)).json();
      DP_DOTS = { at: Date.now(), start: h.start, end: h.end, pts: h.series[tag + ".PV"] || [] };
    }
    renderDatapath();
  } catch {}
}
const hex = w => "0x" + w.toString(16).toUpperCase().padStart(4, "0");
function renderDatapath() {
  const el = $("#dp"); if (!el || !DP) return;
  const d = DP, layer = step().layer, t = TAG[d.tag], q = d.dcs.quality;
  const box = (key, lv, title, sum, body) => `<div class="dpl ${layer === key ? "on" : ""} ${layer === key || DP_OPEN.has(lv + key) ? "open" : ""}" data-dpl="${lv + key}">
    <h5><span class="lv">${lv}</span>${title}</h5><div class="sum">${sum}</div><div class="body">${body}</div></div>`;
  const val = (v, tag = d.tag) => v == null ? "####" : fmt(tag, v);
  const fi = d.field_in, fo = d.field_out;
  const sensor = fi
    ? `<div class="big">${esc(fi.point)}</div><div>${esc(fi.desc.split(",")[0])}</div>`
    : `<div class="big">no sensor</div><div>${esc(d.tag)} is calculated in the DCS from ${(d.calc_from || []).map(tagBtn).join(" ")}</div>`;
  const field = fi
    ? `<div class="kv"><span>Register</span><span>IR ${fi.address}–${fi.address + 1} · FC4 · unit 1</span>
        <span>On the wire</span><span>${fi.words ? `<span class="words"><i>${hex(fi.words[0])}</i><i>${hex(fi.words[1])}</i></span>` : "####"}</span>
        <span>As float32</span><span>${fi.value == null ? "####" : fi.value.toFixed(4)}</span>
        <span>Read at</span><span>${tstr(fi.at)}</span>
        <span>Not here</span><span style="font-family:var(--sans)">name, unit, range, quality</span>
        ${fo ? `<span>Output (down)</span><span>${esc(fo.point)} → HR ${fo.address}–${fo.address + 1} = ${fo.value == null ? "####" : fo.value.toFixed(2)} (FC16)</span>` : ""}</div>`
    : `<div>Nothing on the wire: a calculated tag exists only from the DCS upwards.</div>`;
  const al = t.alarms && Object.keys(t.alarms).length ? Object.entries(t.alarms).map(([k, v]) => `${k} ${v}`).join(" · ") : "none";
  const dcs = `<div class="big">${esc(d.tag)} = ${val(d.dcs.pv)} ${esc(d.unit)}</div><div>${esc(d.desc)}</div>
    <div class="kv"><span>Range</span><span>${d.lo} … ${d.hi} ${esc(d.unit)}</span><span>Alarm limits</span><span>${al}${d.dcs.alarm ? ` (${d.dcs.alarm.limit} active)` : ""}</span>
      ${d.kind === "PID" ? `<span>SP · OP · mode</span><span>${val(d.dcs.sp)} · ${d.dcs.op == null ? "####" : d.dcs.op.toFixed(1) + " %"} · ${d.dcs.mode}</span>` : ""}
      <span>Quality</span><span class="q-${q}">${q}</span><span>Block</span><span>${esc(d.block_label)}</span></div>`;
  const hp = d.historian.points[0];
  const hist = `<div class="kv"><span>Point</span><span>${esc(hp.point)}</span>
      <span>Deadband</span><span>${fmt(d.tag, hp.deadband, 1)} ${esc(hp.unit)} (${d.historian.deadband_pct} % of span)</span>
      <span>Heartbeat</span><span>${d.historian.heartbeat_s} s</span>
      <span>Last stored</span><span>${hp.last ? `${tstr(hp.last.ts)} = ${hp.last.value == null ? "NULL (" + ["GOOD", "BAD", "N/A"][hp.last.quality] + ")" : fmt(d.tag, hp.last.value)}` : "—"}</span>
      <span>Last hour</span><span>${hp.stored_last_hour} stored of ${d.historian.scans_last_hour} scans (${(hp.stored_last_hour / d.historian.scans_last_hour * 100).toFixed(1)} %)</span></div>
      ${layer === "historian" ? `<canvas id="dp-dots"></canvas><div class="think" style="font-size:11.5px">stored samples, last 15 min</div>` : ""}`;
  const n0 = d.opcua.nodes[0];
  const opc = `<div class="kv"><span>NodeId</span><span>${esc(n0.nodeid)}</span><span>Browse path</span><span>${esc(n0.browse)}</span>
      <span>Type</span><span>AnalogItem · Double · EURange ${d.lo}…${d.hi} · ${esc(d.unit)}</span>
      <span>StatusCode</span><span class="${n0.status === "Good" ? "" : "q-BAD"}">${esc(n0.status)}</span>
      <span>Also</span><span>${d.opcua.nodes.slice(1).map(n => n.attr).concat(d.kind === "PID" ? ["Mode"] : []).concat(t.alarms && Object.keys(t.alarms).length ? ["AlarmState"] : []).join(", ") || "—"}</span>
      <span>Endpoint</span><span>${esc(d.opcua.endpoint)}</span></div>`;
  const it = `<div>Node-RED, UaExpert, a Python script, a data platform: they all see the top box, never the bottom one.</div>`;
  const v = val(d.dcs.pv), hl = hp.last;
  el.innerHTML = [
    box("field", "L0", "Instrument", fi ? `${esc(fi.point)} · ${esc(fi.desc.split(",")[0])}` : `none: calculated from ${(d.calc_from || []).join(", ")}`, sensor),
    box("field", "L1", "Field I/O · Modbus TCP", fi ? `IR ${fi.address}–${fi.address + 1} = ${fi.words ? fi.words.map(hex).join(" ") : "####"} → ${fi.value == null ? "####" : fi.value.toFixed(4)}` : "nothing on the wire", field),
    box("dcs", "L2", "DCS · tag", `${esc(d.tag)} = ${v} ${esc(d.unit)} · <span class="q-${q}">${q}</span>`, dcs),
    box("historian", "L2", "DCS historian", `${esc(hp.point)} · last stored ${hl ? tstr(hl.ts) : "—"} · ${hp.stored_last_hour} samples in the last hour`, hist),
    box("opcua", "L3", "OPC UA server", `${esc(n0.nodeid)} = ${v} · ${esc(n0.status)}`, opc),
    box("it", "L4", "IT clients", `see ${v} ${esc(d.unit)}, ${esc(n0.status)}: the top of the stack only`, it),
  ].join("");
  $$(".dpl", el).forEach(b => b.addEventListener("click", e => {
    if (e.target.closest(".body")) return;
    const k = b.dataset.dpl; DP_OPEN.has(k) ? DP_OPEN.delete(k) : DP_OPEN.add(k); renderDatapath();
  }));
  if (layer === "historian") drawDots();
  const sn = $("#snippet");
  if (sn) sn.textContent = `import asyncio
from asyncua import Client

async def main():
    async with Client("${d.opcua.endpoint}") as c:
        node = c.get_node("${n0.nodeid}")
        dv = await node.read_data_value(raise_on_bad_status=False)
        print(dv.Value.Value, dv.StatusCode, dv.SourceTimestamp)

asyncio.run(main())`;
}
function drawDots() {
  const c = $("#dp-dots"); if (!c || !DP_DOTS) return;
  const W = c.clientWidth, H = c.clientHeight, ctx = c.getContext("2d");
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const pts = DP_DOTS.pts.filter(p => p[1] != null);
  ctx.clearRect(0, 0, W, H);
  if (pts.length < 1) return;
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[2])), sp = (hi - lo) || 1;
  const X = t => 4 + (t - DP_DOTS.start) / (DP_DOTS.end - DP_DOTS.start) * (W - 8), Y = v => H - 6 - (v - lo) / sp * (H - 12);
  ctx.strokeStyle = "#a3a8ac"; ctx.beginPath();
  pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, Y(pts[i - 1][1])); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.lineTo(X(DP_DOTS.end), Y(pts[pts.length - 1][1])); ctx.stroke();
  ctx.fillStyle = "#1f2326";
  for (const p of pts) { ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 2.4, 0, 7); ctx.fill(); }
}

/* ---------------------------------------------------------------- polling */
async function poll() {
  try {
    ST = await (await fetch("/api/state")).json();
    renderLive();
    if (document.body.classList.contains("fig") && figBuilt) FIG[figBuilt].update($("#fig-body"));
    if (topic() && topic().dp) refreshDatapath();
  } catch {}
}

(async function init() {
  CFG = await (await fetch("/api/config")).json();
  for (const t of CFG.tags) TAG[t.tag] = t;
  try { HIST = await (await fetch("/api/historian")).json(); } catch {}
  const qTag = new URLSearchParams(location.search).get("tag");
  if (qTag && TAG[qTag]) curTag = qTag;
  if (!location.hash) history.replaceState(null, "", store.get("hcw.trainer", "#eng"));
  await poll();
  parseHash();
  const st = step();
  // the console starts on the step's display, so the first paint is already the right one
  $("#console").src = `/operator?embed=1${st && st.go ? st.go : "#overview"}`;
  route();
  window.addEventListener("hashchange", route);
  setInterval(poll, 1000);
  window.addEventListener("resize", () => { if (DP_DOTS) drawDots(); });
})();
</script>
</body>
</html>
